<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muro · versões da home</title>
<link rel="icon" href="../assets/muro.svg" type="image/svg+xml">
<style>
  /* A switch between the home's versions, for choosing — not part of the site. */
  :root{--ground:#0b0b0b;--bar:#141414;--ink:#eeeeee;--muted:#999;--line:rgba(238,238,238,.1);
        --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);font:14px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--bar);border-bottom:1px solid var(--line)}
  .bar img{width:13px;height:21px}
  .seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:#0e0e0e;border:1px solid #262626}
  .seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:999px;color:var(--muted);white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:#2a2a2a;color:var(--ink)}
  .seg button:focus-visible{outline:2px solid var(--ink)}
  .seg kbd{font:11px var(--mono);color:#666;margin-left:6px}
  .spacer{flex:1}
  .open{color:var(--muted);text-decoration:none;font:12px var(--mono)}
  .open:hover{color:var(--ink)}
  .stage{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto;background:#060606}
  iframe{display:block;border:0;width:100%;height:100%;background:var(--ground)}
  .stage.phone{padding:24px 0}
  .stage.phone iframe{width:390px;height:min(844px,calc(100vh - 110px));flex:none;border-radius:40px;box-shadow:0 0 0 1px #2a2a2a,0 30px 80px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="bar">
  <img src="../assets/muro.svg" alt="Muro" width="13" height="21">
  <div class="seg" role="group" aria-label="Versão" id="ver">
    <button type="button" data-v="classica" data-src="../index.html">Clássica<kbd>1</kbd></button>
    <button type="button" data-v="grade" data-src="0-grade.html">Grade<kbd>2</kbd></button>
    <button type="button" data-v="ensaio" data-src="1-ensaio.html">Ensaio<kbd>3</kbd></button>
    <button type="button" data-v="um-dia" data-src="2-um-dia.html">Um dia<kbd>4</kbd></button>
    <button type="button" data-v="glossario" data-src="3-glossario.html">Glossário<kbd>5</kbd></button>
  </div>
  <div class="seg" role="group" aria-label="Tela" id="dev">
    <button type="button" data-d="desk">Computador</button>
    <button type="button" data-d="phone">Celular</button>
  </div>
  <span class="spacer"></span>
  <a class="open" id="open" target="_blank" rel="noopener">abrir sozinha ↗</a>
</div>
<div class="stage" id="stage"><iframe id="frame" title="Versão da home"></iframe></div>

<script>
  const vers = [...document.querySelectorAll('#ver button')], devs = [...document.querySelectorAll('#dev button')];
  const frame = document.getElementById('frame'), stage = document.getElementById('stage'), open = document.getElementById('open');
  let state = { v: 'classica', d: 'desk' };
  try { Object.assign(state, JSON.parse(localStorage.getItem('muro.versoes') || '{}')); } catch (e) {}
  const fromHash = location.hash.slice(1).split('/');
  if (vers.some(b => b.dataset.v === fromHash[0])) state.v = fromHash[0];
  if (fromHash[1] === 'phone' || fromHash[1] === 'desk') state.d = fromHash[1];

  const apply = () => {
    const b = vers.find(x => x.dataset.v === state.v) || vers[0];
    vers.forEach(x => x.setAttribute('aria-pressed', x === b));
    devs.forEach(x => x.setAttribute('aria-pressed', x.dataset.d === state.d));
    // a fresh copy every time, so a page just edited never shows from the cache
    if (frame.dataset.v !== b.dataset.v) { frame.dataset.v = b.dataset.v; frame.src = `${b.dataset.src}?t=${Date.now()}`; }
    open.href = b.dataset.src;
    stage.classList.toggle('phone', state.d === 'phone');
    history.replaceState(null, '', `#${state.v}/${state.d}`);
    try { localStorage.setItem('muro.versoes', JSON.stringify(state)); } catch (e) {}
  };
  vers.forEach(b => b.addEventListener('click', () => { state.v = b.dataset.v; apply(); }));
  devs.forEach(b => b.addEventListener('click', () => { state.d = b.dataset.d; apply(); }));
  // 1–5 pick a version, ←/→ step through them; also when the page inside has focus
  const keys = e => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    const i = vers.findIndex(x => x.dataset.v === state.v);
    if (/^[1-5]$/.test(e.key)) { state.v = vers[+e.key - 1].dataset.v; apply(); }
    else if (e.key === 'ArrowRight' && e.altKey) { state.v = vers[(i + 1) % vers.length].dataset.v; apply(); }
    else if (e.key === 'ArrowLeft' && e.altKey) { state.v = vers[(i + vers.length - 1) % vers.length].dataset.v; apply(); }
  };
  addEventListener('keydown', keys);
  frame.addEventListener('load', () => { try { frame.contentWindow.addEventListener('keydown', keys); } catch (e) {} });
  apply();
</script>
</body>
</html>
