<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muro — Leia, pense e lembre sem distrações</title>
<meta name="description" content="Um leitor de PDF que segura os aplicativos que te distraem até você ler as páginas do dia.">
<style>
  :root{
    --ground:#101010;
    --ink:#eeeeee;
    --muted:#9b9b9b;
    --rule:rgba(238,238,238,.12);
    --serif:Charter,"Bitstream Charter","Iowan Old Style",Georgia,serif;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--ground);color:var(--ink);
       font-family:var(--sans);font-size:16px;line-height:1.65;
       -webkit-font-smoothing:antialiased}

  .page{max-width:800px;margin:0 auto;padding:0 24px}

  /* the mark, alone at the top — the account buttons the mockup had
     describe a product that doesn't exist yet, so they aren't here */
  header{padding:44px 0 0;text-align:center}
  header img{width:26px;height:42px;display:inline-block}

  .hero{position:relative;text-align:center;padding:64px 0 0}
  .hero::before{content:"";position:absolute;left:50%;top:40px;translate:-50% 0;
    width:min(680px,90vw);height:360px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(238,238,238,.10),transparent 70%);
    pointer-events:none}
  h1{position:relative;font-family:var(--serif);font-weight:400;
     font-size:clamp(32px,5.6vw,60px);line-height:1.12;letter-spacing:-.01em;margin:0}
  h1 em{font-style:italic}
  .lede{position:relative;color:var(--muted);font-size:clamp(15px,2vw,18px);
        max-width:460px;margin:22px auto 0}
  .soon{position:relative;display:block;margin-top:28px;
        color:var(--muted);font-size:14px;letter-spacing:.02em}

  /* the phone screen alone — the Figma draws the device around it, so the
     rounding and the hairline stand in for the hardware */
  .shot{margin:72px auto 0;width:min(340px,80vw);aspect-ratio:375/812;
        border-radius:44px;overflow:hidden;background:#000;
        box-shadow:0 0 0 1px var(--rule), 0 40px 80px rgba(0,0,0,.6)}
  .shot img{display:block;width:100%;height:100%;object-fit:cover}
  .shot.pending{display:grid;place-items:center;color:var(--muted);font-size:14px}

  footer{margin:96px 0 0;border-top:1px solid var(--rule);
         padding:28px 0 64px;display:flex;justify-content:space-between;
         gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="page">

  <header><img src="assets/muro.svg" alt="Muro" width="26" height="42"></header>

  <section class="hero">
    <h1><em>Leia</em>, pense e lembre<br>sem distrações</h1>
    <p class="lede">Um leitor de PDF que segura os aplicativos que te distraem
    até você ler as páginas do dia.</p>
    <span class="soon">Em breve na App Store</span>
  </section>

  <div class="shot">
    <img src="assets/mockup.png" width="750" height="1624"
         alt="Tela do Muro: um livro aberto em leitura, com a meta do dia cumprida.">
  </div>

  <footer>
    <span>Muro</span>
    <span><a href="privacidade.html">Política de Privacidade</a></span>
  </footer>

</div>
</body>
</html>
